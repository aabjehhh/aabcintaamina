<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Amina</title>
  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: sans-serif;
      text-align: center;
      color: #fff;
      padding: 50px 20px;
    }
    h1 {
      font-size: 2.5em;
    }
    p {
      font-size: 1.3em;
    }
    button {
      padding: 15px 30px;
      font-size: 1em;
      background: #ff5e78;
      border: none;
      border-radius: 25px;
      color: white;
      cursor: pointer;
      margin-top: 30px;
    }
    #loveMessage {
      display: none;
      font-size: 1.4em;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <h1>Untuk Amina</h1>
  <p>Hai Amina, aku Aab cuma mau bilang...</p>
  <p><strong>Aku cinta kamu lebih dari apapun di dunia ini.</strong></p>

  <button onclick="document.getElementById('loveMessage').style.display = 'block'">
    Kalau kamu juga sayang Aab, klik ini!
  </button>

  <div id="loveMessage">
    <p>Yay! Aab makin cinta sama Amina! Yuk kita terus bareng ya!</p>
  </div>

</body>
</html>
