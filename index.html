<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aab Cinta Amina Selamanya</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: pink;
      overflow: hidden;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
    }
    h1 {
      color: deeppink;
      margin-top: 50px;
      font-size: 2.5em;
    }
    p {
      color: deeppink;
      margin: 20px;
      font-size: 1.2em;
    }
    .button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(45deg, #ff1493, #ff6ec7);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 1.2em;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    .floating-heart, .floating-image {
      position: absolute;
      animation: float 10s infinite;
      opacity: 0.7;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-100px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>

<h1>Aab Cinta Amina Selamanya</h1>
<p>
  Amina, kamu itu semangat pagiku, indahnya malamku, dan alasanku tersenyum setiap hari.<br>
  Aku janji akan terus mencintaimu, memanjakan kamu, dan namamu sudah tertanam di hatiku.<br>
  Kamu satu-satunya untukku, nggak akan tergantikan, selamanya!
</p>

<!-- Button -->
<button class="button" onclick="playMusic()">Aku Sayang Kamu! ❤️</button>

<!-- Hearts -->
<script>
  for (let i = 0; i < 30; i++) {
    let heart = document.createElement('div');
    heart.className = 'floating-heart';
    heart.innerHTML = '❤️';
    heart.style.top = Math.random() * 100 + '%';
    heart.style.left = Math.random() * 100 + '%';
    heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
    document.body.appendChild(heart);
  }
</script>

<!-- Floating Images -->
<img src="https://files.catbox.moe/4uohvk.jpg" class="floating-image" style="top:10%; left:5%; width:80px;">
<img src="https://files.catbox.moe/7zynf0.jpg" class="floating-image" style="top:30%; left:80%; width:100px;">
<img src="https://files.catbox.moe/13pmtz.jpg" class="floating-image" style="top:60%; left:10%; width:90px;">
<img src="https://files.catbox.moe/gzn4gk.jpg" class="floating-image" style="top:80%; left:70%; width:110px;">

<!-- Musik -->
<audio id="loveSong" src="https://tinyurl.com/love-music-aab" preload="auto"></audio>

<script>
  function playMusic() {
    const audio = document.getElementById('loveSong');
    audio.play();
    alert('Aku sayang kamu, Amina! ❤️');
  }
</script>

</body>
</html>
