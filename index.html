<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aab & Amina</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to bottom, #ffd1dc, #ffe4e1);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      color: #fff;
      text-align: center;
      overflow-x: hidden;
    }
    h1 {
      margin-top: 60px;
      font-size: 2.8em;
      color: #ff3366;
      animation: fadeIn 2s ease-in-out;
    }
    p {
      font-size: 1.4em;
      color: #fff;
      margin-top: 20px;
      padding: 0 20px;
      animation: fadeIn 3s ease-in-out;
    }
    button {
      margin-top: 30px;
      padding: 15px 30px;
      background: #ff6699;
      border: none;
      border-radius: 30px;
      font-size: 1.2em;
      cursor: pointer;
      color: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: 0.3s;
    }
    button:hover {
      background: #ff3366;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(30px);}
      to {opacity: 1; transform: translateY(0);}
    }
    .love {
      position: fixed;
      top: -50px;
      color: #ff4d88;
      font-size: 30px;
      animation: fall 6s linear infinite;
    }
    @keyframes fall {
      0% {top: -50px; opacity: 1;}
      100% {top: 110%; opacity: 0;}
    }
  </style>
</head>
<body>

  <h1>Hai Amina</h1>
  <p>Dari Aab buat cewek paling manis sedunia. Kamu itu semesta aku, pelangi di hidupku.</p>

  <button onclick="showLove()">Klik kalau kamu sayang Aab</button>

  <p id="response" style="display:none; margin-top: 40px; font-size: 1.5em;">
    Aku juga sayang kamu selamanya, Amina!
  </p>

  <audio autoplay loop hidden>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <script>
    function showLove() {
      document.getElementById('response').style.display = 'block';
    }

    // Animasi love jatuh
    setInterval(() => {
      const heart = document.createElement('div');
      heart.classList.add('love');
      heart.style.left = Math.random() * 100 + 'vw';
      heart.innerText = '❤️';
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }, 300);
  </script>

</body>
</html>
