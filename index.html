<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aab & Amina Forever</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(to bottom right, #ffc1cc, #ffe4e1);
      font-family: 'Poppins', sans-serif;
      text-align: center;
      color: #d81159;
      height: 100vh;
      position: relative;
    }
    h1 {
      margin-top: 20px;
      font-size: 32px;
      animation: fadeIn 2s ease-in-out infinite alternate;
    }
    .photo {
      width: 250px;
      border-radius: 20px;
      margin: 20px auto;
      animation: fadeInPhoto 3s ease-in-out infinite alternate;
    }
    @keyframes fadeInPhoto {
      0% {opacity: 0;}
      100% {opacity: 1;}
    }
    @keyframes fadeIn {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }
    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .hearts span {
      position: absolute;
      display: block;
      width: 20px;
      height: 20px;
      background: url('https://upload.wikimedia.org/wikipedia/commons/3/36/Emoji_u2764.svg') no-repeat center;
      background-size: contain;
      animation: fall 10s linear infinite;
      opacity: 0.8;
    }
    @keyframes fall {
      0% { transform: translateY(-10%) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }
    audio {
      display: none;
    }
  </style>
</head>
<body>

  <h1 id="text"></h1>

  <img src="foto1.jpg" class="photo" id="photo1" style="display:none;">
  <img src="foto2.jpg" class="photo" id="photo2" style="display:none;">
  <img src="foto3.jpg" class="photo" id="photo3" style="display:none;">
  <img src="foto4.jpg" class="photo" id="photo4" style="display:none;">

  <div class="hearts" id="hearts"></div>

  <audio autoplay loop>
    <source src="musik.mp3" type="audio/mpeg">
  </audio>

<script>
  // Teks berjalan
  const texts = [
    "Aku Sayang Kamu Amina!",
    "Selamanya Bersamamu",
    "Tak Akan Pernah Berpisah",
    "Kamu Segalanya untukku"
  ];
  let count = 0;
  let textElement = document.getElementById('text');

  function changeText() {
    textElement.innerHTML = texts[count];
    count = (count + 1) % texts.length;
  }
  setInterval(changeText, 3000);
  changeText();

  // Ganti foto fade in
  const photos = ["photo1", "photo2", "photo3", "photo4"];
  let photoIndex = 0;

  function showPhoto() {
    photos.forEach(id => document.getElementById(id).style.display = "none");
    document.getElementById(photos[photoIndex]).style.display = "block";
    photoIndex = (photoIndex + 1) % photos.length;
  }
  setInterval(showPhoto, 4000);
  showPhoto();

  // Efek hati jatuh
  const hearts = document.getElementById('hearts');
  setInterval(() => {
    const heart = document.createElement('span');
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
    hearts.appendChild(heart);
    setTimeout(() => {
      heart.remove();
    }, 10000);
  }, 300);
</script>

</body>
</html>
